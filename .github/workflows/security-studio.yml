name: Security Studio
on:
  push:
    branches: [security/certificate-trust]
    paths: ['.github/workflows/security-studio.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: security
      - uses: actions/checkout@v4
        with:
          repository: supabase/supabase
          ref: cb4307f15b99e02a8a56e103086d1eab72eb9e9a
          path: vendor
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Apply framework and certificate security updates
        working-directory: vendor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('pnpm-workspace.yaml')
          text=p.read_text()
          for name,version in [('next','16.4.2'),('react','19.3.1'),('react-dom','19.3.1')]:
              text,count=re.subn(r'(?m)^(  '+re.escape(name)+r':) .+$',r'\1 '+version,text)
              assert count==1,(name,count)
          p.write_text(text)
          p=Path('apps/studio/Dockerfile')
          text=p.read_text().replace('FROM node:22-slim AS base','FROM node:22.23.3-bookworm-slim AS base')
          text=text.replace('apt-get update -qq &&','apt-get update -qq && apt-get upgrade -y &&',1)
          text=text.replace('WORKDIR /app','COPY security-ca.pem /etc/ssl/certs/ca-certificates.crt\nENV NODE_OPTIONS="--use-openssl-ca --max-old-space-size=4096" SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt SSL_CERT_DIR=/run/empty-ca-directory NEXT_TELEMETRY_DISABLED=1\nWORKDIR /app',1)
          p.write_text(text)
          PY
          cp ../security/docker/security/bun/ca-certificates.crt security-ca.pem
          npm install -g "$(node -p 'require("./package.json").packageManager')"
          pnpm install --lockfile-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: studio-security-lockfile
          path: vendor/pnpm-lock.yaml
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: vendor
          file: vendor/apps/studio/Dockerfile
          target: production
          push: true
          tags: ghcr.io/yeusepe/coolify:studio-security-20261020
          labels: |
            org.opencontainers.image.source=https://github.com/Yeusepe/coolify
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor-source=https://github.com/supabase/supabase/tree/cb4307f15b99e02a8a56e103086d1eab72eb9e9a
