name: Security Studio
on:
  workflow_dispatch:
  push:
    branches: [main, security/certificate-trust, security/vendor-node-patches, security/node-brotli-20261021, security/legacy-dependencies-20261025]
    paths: ['.github/workflows/security-studio.yml', 'docker/security/vendor-node/zod-compat.cjs']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: security
      - uses: actions/checkout@v4
        with:
          repository: supabase/supabase
          ref: cb4307f15b99e02a8a56e103086d1eab72eb9e9a
          path: vendor
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Apply framework and certificate security updates
        working-directory: vendor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json,os
          p=Path('pnpm-workspace.yaml')
          text=p.read_text()
          for name,version in [('next','16.4.3'),('react','19.3.1'),('react-dom','19.3.1')]:
              text,count=re.subn(r'(?m)^(  '+re.escape(name)+r':) .+$',r'\1 '+version,text)
              assert count==1,(name,count)
          text,count=re.subn(r'(?m)^overrides:\s*$', "overrides:\n  'zod@<4': file:./security-zod\n  'zod@>=4': 4.6.7\n  simple-git: 4.0.1\n  '@simple-git/argv-parser': 2.0.1\n  'picomatch@^2': 2.3.2\n  'picomatch@^4': 4.0.4", text, count=1)
          assert count==1
          next_packages=['next']+['@next/'+name for name in ['env','swc-darwin-arm64','swc-darwin-x64','swc-linux-arm64-gnu','swc-linux-arm64-musl','swc-linux-x64-gnu','swc-linux-x64-musl','swc-win32-arm64-msvc','swc-win32-x64-msvc']]
          text=text.replace('minimumReleaseAgeExclude:', 'minimumReleaseAgeExclude:'+''.join("\n  - '"+name+"@16.4.3'" for name in next_packages))
          text=text.replace('express-rate-limit>ip-address: ^10.1.1','express-rate-limit>ip-address: 10.7.4')
          p.write_text(text)
          # Catalog references bypass version-scoped overrides. Point those legacy consumers at the patched API explicitly.
          changed=0
          for p in Path('.').rglob('package.json'):
              package=json.loads(p.read_text())
              for field in ['dependencies','devDependencies','optionalDependencies']:
                  if package.get(field,{}).get('zod')=='catalog:':
                      package[field]['zod']='file:'+os.path.relpath('security-zod',p.parent).replace(os.sep,'/')
                      changed+=1
              p.write_text(json.dumps(package,indent=2)+'\n')
          assert changed>0
          p=Path('apps/studio/Dockerfile')
          text=p.read_text().replace('FROM node:22-slim AS base','FROM node:22.23.4-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d AS base')
          text=text.replace('WORKDIR /app','COPY brotli-regression.cjs /tmp/brotli-regression.cjs\nRUN node /tmp/brotli-regression.cjs && rm /tmp/brotli-regression.cjs\nWORKDIR /app',1)
          text=text.replace('apt-get update -qq &&','apt-get update -qq && apt-get upgrade -y &&',1)
          text=text.replace('WORKDIR /app','COPY security-ca.pem /etc/ssl/certs/ca-certificates.crt\nENV NODE_OPTIONS="--use-openssl-ca --max-old-space-size=4096" SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt SSL_CERT_DIR=/run/empty-ca-directory NEXT_TELEMETRY_DISABLED=1\nWORKDIR /app',1)
          text=text.replace('COPY ./patches/ ./patches', 'COPY ./patches/ ./patches\nCOPY security-zod ./security-zod')
          text=text.replace('FROM base AS production','FROM base AS production\nRUN rm -rf /usr/local/lib/node_modules/npm /usr/local/bin/npm /usr/local/bin/npx',1)
          p.write_text(text)
          PY
          cp ../security/docker/security/bun/ca-certificates.crt security-ca.pem
          cp ../security/docker/security/bun/brotli-regression.cjs brotli-regression.cjs
          npm install -g "$(node -p 'require("./package.json").packageManager')"
          mkdir -p security-zod
          npm pack zod@4.6.7 --pack-destination /tmp --ignore-scripts >/dev/null
          tar -xzf /tmp/zod-4.6.7.tgz --strip-components=1 -C security-zod
          node -e 'require("../security/docker/security/vendor-node/zod-compat.cjs")(require("path").resolve("security-zod"))'
          node -e 'const fs=require("fs"),p="security-zod/package.json",m=JSON.parse(fs.readFileSync(p));m.version="3.25.76";m.racconify.upstreamSource="zod@4.6.7";fs.writeFileSync(p,JSON.stringify(m,null,2))'
          pnpm install --lockfile-only --ignore-scripts
          python3 - <<'PY'
          from pathlib import Path
          import re
          entries=set(re.findall(r'^  (zod@\d[^:]*):\s*$',Path('pnpm-lock.yaml').read_text(),re.M))
          assert entries <= {'zod@4.6.7'},entries
          assert 'zod@file:security-zod:' in Path('pnpm-lock.yaml').read_text()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: studio-security-lockfile
          path: vendor/pnpm-lock.yaml
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: vendor
          file: vendor/apps/studio/Dockerfile
          target: production
          push: true
          tags: ghcr.io/yeusepe/coolify:studio-legacy-rebuilt-20261025
          labels: |
            org.opencontainers.image.source=https://github.com/Yeusepe/coolify
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor-source=https://github.com/supabase/supabase/tree/cb4307f15b99e02a8a56e103086d1eab72eb9e9a
