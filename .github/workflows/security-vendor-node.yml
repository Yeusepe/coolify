name: Security vendor Node libraries
on:
  workflow_dispatch:
  push:
    branches: [main, security/vendor-node-patches, security/node-brotli-20261021]
    paths: ['docker/security/vendor-node/**', '.github/workflows/security-vendor-node.yml', 'docker/security/bun/brotli-regression.cjs']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: meta
            base: ghcr.io/yeusepe/coolify@sha256:01ec5b5cdefabaab5a32ab8686ac93b006a9b8e890017d8df4fb6482afd1da70
            node: node:22.23.4-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
          - name: storage
            base: ghcr.io/yeusepe/coolify@sha256:df6b95dfd5a613383a5729f701c326619b9ec2c89e3e95343dfafb52fa1e1521
            node: node:24.22.1-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/security/vendor-node/Dockerfile
          push: true
          tags: ghcr.io/yeusepe/coolify:security-${{ matrix.name }}-node-20261021
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            NODE_IMAGE=${{ matrix.node }}
          labels: |
            org.opencontainers.image.source=https://github.com/Yeusepe/coolify
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ matrix.base }}
