name: November security package updates
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: storage-nov
            base: ghcr.io/yeusepe/coolify@sha256:b167334716c4872dedebdef596011b34d01e33c36ca9f49f72637af711b2dd4a
            node: node:24.22.1-alpine3.23@sha256:0468540aa58203ff9e40c2aab3907c52644ab818af6176b1c70a026137dc92a2
          - name: mongosh-nov
            base: ghcr.io/yeusepe/coolify@sha256:12706b98d3df0a94bf7ff887120962d298c5e28ead1bd599ad870d81361d0244
            node: node:24.22.1-bookworm-slim
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/security/vendor-node/Dockerfile.packages
          push: true
          tags: ghcr.io/yeusepe/coolify:security-${{ matrix.name }}-${{ github.sha }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            PROFILE=${{ matrix.name }}
            NODE_IMAGE=${{ matrix.node }}
          labels: |
            org.opencontainers.image.source=https://github.com/Yeusepe/coolify
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ matrix.base }}
