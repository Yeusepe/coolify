name: Security vendor Node libraries
on:
  workflow_dispatch:
  push:
    branches: [main, security/vendor-node-patches, security/node-brotli-20261021, security/reviewed-runtime-patches-20261025]
    paths: ['docker/security/vendor-node/**', '.github/workflows/security-vendor-node.yml', 'docker/security/bun/brotli-regression.cjs']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: meta
            base: ghcr.io/yeusepe/coolify@sha256:5d8a40f96d8c601e0e144cd3fe4a8be1643b9704d74bf85835b93bb661750aa5
            node: node:22.23.4-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
          - name: storage
            base: ghcr.io/yeusepe/coolify@sha256:47ea93ec6b7454e188820b6c66e23b58824969d15fb2cc893578a9a3ccb3e283
            node: node:24.22.1-alpine3.23@sha256:0468540aa58203ff9e40c2aab3907c52644ab818af6176b1c70a026137dc92a2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/security/vendor-node/Dockerfile.dependencies
          push: true
          tags: ghcr.io/yeusepe/coolify:security-${{ matrix.name }}-reviewed-20261025
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            PROFILE=${{ matrix.name }}
            NODE_IMAGE=${{ matrix.node }}
          labels: |
            org.opencontainers.image.source=https://github.com/Yeusepe/coolify
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ matrix.base }}
