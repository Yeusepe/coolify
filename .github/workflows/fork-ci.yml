name: Fork checks and image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run all upstream unit and feature tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fork-${{ github.ref }}-${{ inputs.full_suite || false }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pdo_sqlite, sockets, redis, pcntl, zip, gd
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.testing .env
      - run: node --test tests/Scripts/passkeys.test.js
      - run: bash tests/Scripts/fork-update-test.sh
      - run: npm ci
      - run: npm run build
      - run: vendor/bin/pint --test tests/Feature/AppIconsTest.php
      - name: Full upstream regression suite
        if: inputs.full_suite == true
        run: php artisan test --compact --stop-on-failure tests/Unit tests/Feature
      - name: Fork and upgrade regression checks
        if: inputs.full_suite != true
        run: >-
          php artisan test --compact
          tests/Feature/PasskeysTest.php
          tests/Feature/FortifyProfileInformationRouteTest.php
          tests/Feature/OauthLoginTeamSelectionTest.php
          tests/Feature/AppIconsTest.php
          tests/Feature/PlaintextSecretEncryptionTest.php
          tests/Feature/EnvironmentVariableLegacyEscapingTest.php
          tests/Feature/PreserveComposeNullMigrationTest.php
          tests/Feature/TraefikCertificateResolverMigrationTest.php
          tests/Feature/CoolifyDefaultEnvironmentVariablesTest.php
          tests/Feature/AutoUpdateFrequencyDefaultTest.php
          tests/Feature/SubscriptionEndedAtTest.php
          tests/Feature/LoginAndMcpAccessTest.php
          tests/Feature/Security/ApiTokenCreationSecurityTest.php
          tests/Feature/TeamSwitchConcurrentRequestTest.php
          tests/Feature/DashboardServerMetricsChartTest.php
      - run: php artisan view:cache
      - run: php artisan view:clear

  image:
    needs: checks
    if: inputs.full_suite != true && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/yeusepe/coolify:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Yeusepe/coolify
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Promote the completed build for automatic deployment
        if: github.ref == 'refs/heads/main'
        run: docker buildx imagetools create --tag ghcr.io/yeusepe/coolify:fork-main ghcr.io/yeusepe/coolify:sha-${{ github.sha }}
