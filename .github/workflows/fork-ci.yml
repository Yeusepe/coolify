name: Fork checks and image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run all upstream unit and feature tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fork-${{ github.ref }}-${{ inputs.full_suite && github.sha || 'focused' }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pdo_sqlite, sockets, redis, pcntl, zip, gd
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.testing .env
      - run: npm ci
      - run: node --test tests/Scripts/passkeys.test.js
      - run: bash tests/Scripts/fork-update-test.sh
      - run: python3 tests/Scripts/source-scanner-test.py && python3 tests/Scripts/source-snapshot-test.py
      - run: npm run build
      - run: >-
          vendor/bin/pint --test app/Livewire/Server/Proxy.php
          tests/Feature/AppIconsTest.php tests/Unit/ApplicationDeploymentJobCommitResolutionTest.php
          tests/Unit/GithubRunnerContainerTest.php tests/Unit/LivewireInternalRedirectTest.php
          tests/Feature/DevelopmentQemuVmTest.php tests/Feature/ReverbOpenFileLimitTest.php
          tests/Feature/DevScriptTest.php tests/Feature/Ipv6ServerAddressUrlTest.php
          tests/Feature/ApplicationGeneralBuildpackSelectorTest.php
          tests/Feature/Authorization/ResourceHeadingAuthorizationTest.php
          tests/Feature/RedisUsernameEnvironmentVariableTest.php tests/Feature/StandaloneSqliteTest.php
          tests/Unit/ProductionImageWorkflowTest.php
          tests/Feature/ServerSettingsAuditTest.php
          tests/Feature/CveNowServiceTest.php
          tests/Feature/CweServiceTest.php
          tests/Feature/SourceScanServiceTest.php tests/Feature/SourceScanningTest.php
          app/Services/SourceScanService.php app/Jobs/ServerSourceScanJob.php app/Livewire/Server/Security/SourceScanning.php
          tests/Feature/SoftwareRecommendationServiceTest.php
          tests/TestCase.php
          tests/Feature/SshMultiplexingLockTest.php
          app/Actions/Server/CheckHostSecurity.php app/Actions/Server/CheckUpdates.php
          app/Jobs/ServerPatchCheckJob.php app/Notifications/Server/ServerPatchCheck.php
          app/Livewire/Server/Security/Patches.php
          tests/Feature/Server/HostSecurityCheckTest.php tests/Feature/Server/ServerPatchesTest.php
          tests/Feature/Server/ServerListPatchStatusTest.php tests/Unit/Actions/Server/ServerPatchCommandsTest.php
      - name: Full upstream regression suite
        if: inputs.full_suite == true
        run: php artisan test --compact --parallel --processes=4 --testsuite=Unit,Feature
      - name: Fork and upgrade regression checks
        if: inputs.full_suite != true
        run: >-
          php artisan test --compact
          tests/Feature/PasskeysTest.php
          tests/Feature/PasskeyUpgradeTest.php tests/Feature/Auth
          tests/Feature/FortifyProfileInformationRouteTest.php
          tests/Feature/OauthLoginTeamSelectionTest.php
          tests/Feature/AppIconsTest.php
          tests/Feature/PlaintextSecretEncryptionTest.php
          tests/Feature/EnvironmentVariableLegacyEscapingTest.php
          tests/Feature/PreserveComposeNullMigrationTest.php
          tests/Feature/TraefikCertificateResolverMigrationTest.php
          tests/Feature/CoolifyDefaultEnvironmentVariablesTest.php
          tests/Feature/AutoUpdateFrequencyDefaultTest.php
          tests/Feature/SubscriptionEndedAtTest.php
          tests/Feature/LoginAndMcpAccessTest.php
          tests/Feature/Security/ApiTokenCreationSecurityTest.php
          tests/Feature/TeamSwitchConcurrentRequestTest.php
          tests/Feature/DashboardServerMetricsChartTest.php
          tests/Unit/ApplicationDeploymentJobCommitResolutionTest.php
          tests/Unit/GithubRunnerContainerTest.php
          tests/Unit/LivewireInternalRedirectTest.php
          tests/Unit/LivewireSyncDataAuthorizationTest.php
          tests/Unit/ProductionImageWorkflowTest.php
          tests/Feature/DevelopmentQemuVmTest.php
          tests/Feature/ReverbOpenFileLimitTest.php
          tests/Feature/DevScriptTest.php
          tests/Feature/Ipv6ServerAddressUrlTest.php
          tests/Feature/ApplicationGeneralBuildpackSelectorTest.php
          tests/Feature/Authorization/ResourceHeadingAuthorizationTest.php
          tests/Feature/RedisUsernameEnvironmentVariableTest.php
          tests/Feature/StandaloneSqliteTest.php
          tests/Feature/ServerProxyConfigurationAuthorizationTest.php
          tests/Feature/SshMultiplexingLockTest.php
          tests/Feature/ServerSettingsAuditTest.php
          tests/Feature/CveNowServiceTest.php
          tests/Feature/CweServiceTest.php
          tests/Feature/SoftwareRecommendationServiceTest.php
          tests/Feature/CveNowMonitoringTest.php
          tests/Feature/SourceScanServiceTest.php tests/Feature/SourceScanningTest.php
          tests/Feature/Server/HostSecurityCheckTest.php tests/Feature/Server/ServerPatchesTest.php
          tests/Feature/Server/ServerListPatchStatusTest.php tests/Feature/Server/ServerPatchCheckNotificationTest.php
          tests/Unit/Actions/Server/ServerPatchCommandsTest.php
      - run: php artisan test --compact tests/Feature/ReverbAndTerminalPackagingTest.php --filter="runs Reverb and terminal"
      - run: php artisan view:cache
      - run: php artisan view:clear

  image:
    needs: checks
    if: inputs.full_suite != true && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Read image metadata
        id: metadata
        run: |
          version="$(jq -er '.stable.coolify' release.json)"
          {
            echo "version=$version"
            echo "created=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
            echo "epoch=$(git log -1 --format=%ct)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COOLIFY_VERSION=${{ steps.metadata.outputs.version }}
            CREATED=${{ steps.metadata.outputs.created }}
            SOURCE_DATE_EPOCH=${{ steps.metadata.outputs.epoch }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/yeusepe/coolify:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Yeusepe/coolify
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Promote the completed build for automatic deployment
        if: github.ref == 'refs/heads/main'
        run: docker buildx imagetools create --tag ghcr.io/yeusepe/coolify:fork-main ghcr.io/yeusepe/coolify:sha-${{ github.sha }}
