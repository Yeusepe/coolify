name: Security PHP base
on:
  push:
    branches: [security/certificate-trust]
    paths: ['.github/workflows/security-php.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: serversideup/docker-php
          ref: 92b16c9ee63bde4f75cdcc7ebe96aee36a896f88
      - name: Use the patched mainline Nginx repository
        run: sed -i 's|http://nginx.org/packages/alpine/v|https://nginx.org/packages/mainline/alpine/v|' src/variations/fpm-nginx/Dockerfile
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: src/variations/fpm-nginx/Dockerfile
          push: true
          tags: ghcr.io/yeusepe/coolify:php-security-20261020
          build-args: |
            PHP_VERSION=8.4.26
            BASE_OS_VERSION=alpine3.23
            NGINX_VERSION=1.31.2-r1
            REPOSITORY_BUILD_VERSION=4.5.1-security-20261020
          labels: |
            org.opencontainers.image.source=https://github.com/Yeusepe/coolify
            org.opencontainers.image.vendor-source=https://github.com/serversideup/docker-php/tree/92b16c9ee63bde4f75cdcc7ebe96aee36a896f88
