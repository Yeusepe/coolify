name: Security runtime
on:
  workflow_dispatch:
  push:
    branches: [main, security/certificate-trust, security/node-brotli-20261021]
    paths: ['docker/security/bun/**', '.github/workflows/security-runtime.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker/security/bun
          push: true
          tags: ghcr.io/yeusepe/coolify:bun-security-20261021
          labels: |
            org.opencontainers.image.source=https://github.com/Yeusepe/coolify
            org.opencontainers.image.revision=${{ github.sha }}
