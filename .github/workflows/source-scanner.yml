name: Source scanner image
on:
  push:
    branches: [main, feature/source-code-scanning]
    paths: ['docker/source-scanner/**', '.github/workflows/source-scanner.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python3 tests/Scripts/source-scanner-test.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: .
          file: docker/source-scanner/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/yeusepe/coolify:source-scanner-${{ github.sha }}
          cache-from: type=gha,scope=source-scanner
          cache-to: type=gha,scope=source-scanner,mode=max
      - run: echo '${{ steps.build.outputs.digest }}'
      - name: Verify isolated real-engine scanning
        env:
          SCANNER: ghcr.io/yeusepe/coolify@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/source-scanner-fixture"
          printf '%s\n' 'export function run(input) { const marker = "PRIVATE_SOURCE_SENTINEL"; return eval(input); }' > "$RUNNER_TEMP/source-scanner-fixture/vulnerable.js"
          # The pinned one-file scanner extracts its own runtime into this private tmpfs.
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 --tmpfs /tmp:rw,exec,nosuid,size=512m --mount "type=bind,src=$RUNNER_TEMP/source-scanner-fixture,dst=/src,readonly" "$SCANNER" > "$RUNNER_TEMP/source-scan.json"
          python3 - "$RUNNER_TEMP/source-scan.json" <<'PY'
          import json, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_text()
          data = json.loads(raw)
          assert data['status'] == 'completed', data
          assert data['files_scanned'] == 1, data
          assert any('CWE-95' in finding['cwes'] for finding in data['findings']), data
          assert 'PRIVATE_SOURCE_SENTINEL' not in raw
          print('Real engine found the unsafe fixture without returning source contents.')
          PY
